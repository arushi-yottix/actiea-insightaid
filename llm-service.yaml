apiVersion: v1
kind: Service
metadata:
  name: llm-service
  namespace: insightaid
  labels:
    app: llm-service
spec:
  type: ClusterIP  # Internal service only
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: http
  selector:
    app: llm-service
  # No session affinity needed - stateless service

