apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: insightaid
  labels:
    app: rag-api
spec:
  type: LoadBalancer  # Use ClusterIP for internal only, LoadBalancer for external access
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: rag-api
  sessionAffinity: ClientIP  # Sticky sessions for better caching
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours

